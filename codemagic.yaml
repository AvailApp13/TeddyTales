# Сборка iOS и автоматическая отправка в TestFlight.
#
# Сборка запускается вручную кнопкой в Codemagic — это осознанно: пока
# приложение в разработке, каждая сборка занимает минуты платного времени на
# macOS-агенте. Всё, что после нажатия, идёт без рук: тесты, подпись, ipa,
# загрузка в App Store Connect и раздача тестировщикам в TestFlight.
#
# Когда захотите собирать автоматически на каждый push — раскомментируйте
# блок `triggering` ниже.
#
# Что должно быть настроено на стороне Codemagic до первого запуска:
#   1. Интеграция App Store Connect с именем `Codemagic Admin 2`
#      (Teams → Integrations → Developer Portal → добавить ключ API).
#   2. Группа переменных `appstore` с переменной APP_STORE_APP_ID —
#      числовой ID приложения из App Store Connect.
#   3. Группа тестировщиков `Internal testers` в TestFlight.
# Подробный порядок — docs/release-ios.md.

definitions:
  # Версия Flutter закреплена намеренно. `stable` меняется под ногами, и
  # сборка, которая шла вчера, завтра падает на чужом релизе.
  flutter_version: &flutter_version 3.44.9

workflows:
  # Android: APK для тестировщиков. Ставится на телефон напрямую из письма
  # или из раздела Artifacts сборки (в настройках телефона разрешить
  # установку из этого источника). Подпись пока отладочная — для Google
  # Play понадобится свой ключ, это отдельный шаг.
  android-apk:
    name: Android → APK
    instance_type: linux_x2
    max_build_duration: 45

    environment:
      flutter: *flutter_version
      java: 21

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Зависимости
        script: flutter pub get

      - name: Анализ и тесты
        script: |
          flutter analyze
          flutter test

      - name: Сборка APK
        # BUILD_NUMBER Codemagic растёт сам от сборки к сборке — Android
        # требует, чтобы номер версии только увеличивался.
        script: |
          flutter build apk --release --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - ru.life3@gmail.com
        notify:
          success: true
          failure: true

  # Android: бета во внутреннем канале Google Play (КП 17.2).
  #
  # ⚠ ЖДЁТ НАСТРОЙКИ — без неё сборка упадёт на подписи или публикации:
  #   1. Google Play Console: приложение com.teddytales.app создано, первый
  #      AAB загружен вручную (так требует Google для нового приложения),
  #      в «Внутреннее тестирование» добавлены тестировщики.
  #   2. Codemagic → Teams → Code signing identities → Android keystores:
  #      ключ загрузки с именем `teddytales_upload` (создать один раз и
  #      хранить — потеря ключа = новое приложение в Google Play).
  #   3. Группа переменных `google_play` с GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
  #      — JSON сервисного аккаунта с доступом к Play Console (выпуски).
  # Порядок — docs/release-android.md.
  android-play-internal:
    name: Android → Google Play (внутренний)
    instance_type: linux_x2
    max_build_duration: 45

    environment:
      flutter: *flutter_version
      java: 21
      android_signing:
        - teddytales_upload
      groups:
        - google_play
      vars:
        PACKAGE_NAME: com.teddytales.app

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Зависимости
        script: flutter pub get

      - name: Анализ и тесты
        script: |
          flutter analyze
          flutter test

      - name: Номер сборки
        # Google Play принимает только растущий versionCode: берём последний
        # из магазина плюс один.
        script: |
          set -e
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          BUILD_NUMBER=$(( ${LATEST:-0} + 1 ))
          echo "Номер этой сборки: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Сборка AAB
        script: |
          flutter build appbundle --release --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Пока приложение не прошло проверку Google, выпуск — черновиком.
        # Ключ Codemagic — submit_as_draft (release_status он не знает и
        # бракует весь файл, вместе с iOS; 28.09).
        submit_as_draft: true
      email:
        recipients:
          - ru.life3@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true

    integrations:
      # Имя должно побуквенно совпадать с ключом в Codemagic:
      # Settings → Integrations → Developer Portal → Manage keys.
      # Если имя разошлось, автоподпись молча не подключается, и сборка
      # падает с «No matching profiles found» ещё до первого шага.
      app_store_connect: Codemagic Admin 2

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.teddytales.app

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $FCI_BUILD_DIR/ios/Pods

    scripts:
      - name: Зависимости
        script: flutter pub get

      - name: Анализ и тесты
        # Гейт намеренно жёсткий: в TestFlight не должно уезжать то, что не
        # проходит анализатор. Тестировщики — живые люди, их время дороже
        # минуты сборки.
        script: |
          flutter analyze
          flutter test

      - name: Номер сборки
        # TestFlight требует строго возрастающий номер. Схема «последний плюс
        # один» разбилась о реальность: в TestFlight уже лежал номер-таймстамп
        # 20260811051703 от прежних сборок, и арифметика столкнулась с ним.
        # Теперь номер — текущие дата-время до секунды: он больше любого
        # прежнего и растёт сам собой от сборки к сборке. Подстраховка: если
        # у Apple вдруг лежит число ещё больше, берём его плюс один.
        script: |
          set -e
          STAMP=$(date -u +%Y%m%d%H%M%S)
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APP_ID" 2>/dev/null || echo "")
          echo "Последний в TestFlight: ${LATEST:-<нет>}; таймстамп: $STAMP"
          if [ -n "$LATEST" ] && [ "$LATEST" -ge "$STAMP" ] 2>/dev/null; then
            BUILD_NUMBER=$(($LATEST + 1))
          else
            BUILD_NUMBER=$STAMP
          fi
          echo "Номер этой сборки: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Вход через Apple и push в портале
        # Включает у Bundle ID «Sign In with Apple» и «Push Notifications» тем
        # же ключом API, что и подпись (заказчик 06.10: «сам всё сделай»).
        # Что уже включено — не трогает. Если хоть что-то включили сейчас,
        # старые профили App Store удаляются: в них нет новых прав, и
        # следующий шаг создаст свежий профиль уже с ними.
        #
        # Ответ app-store-connect с --json бывает с текстовыми строками
        # журнала перед JSON (сборка 06.10 упала на этом) — поэтому JSON
        # ищется в ответе, а не читается целиком.
        script: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          def run(*args, want_json=True, fatal=True):
              cmd = ["app-store-connect", *args] + (["--json"] if want_json else [])
              print("$", " ".join(cmd), flush=True)
              r = subprocess.run(cmd, capture_output=True, text=True)
              sys.stderr.write(r.stderr)
              if r.returncode != 0:
                  print(r.stdout)
                  if fatal:
                      sys.exit(f"Команда упала: {' '.join(args)}")
                  return False
              return find_json(r.stdout) if want_json else True

          def find_json(text):
              decoder = json.JSONDecoder()
              for i, ch in enumerate(text):
                  if ch in "[{":
                      try:
                          return decoder.raw_decode(text[i:])[0]
                      except ValueError:
                          continue
              sys.exit("В ответе нет JSON: " + text[:500])

          def attrs(item):
              return item.get("attributes") or {}

          bundle = os.environ["BUNDLE_ID"]
          found = [b for b in run("bundle-ids", "list", "--bundle-id-identifier", bundle)
                   if attrs(b).get("identifier") == bundle]
          if not found:
              sys.exit(f"Bundle ID {bundle} не найден")
          bid = found[0]["id"]
          print(f"Bundle ID {bundle}: {bid}")

          have = set()
          for c in run("bundle-ids", "capabilities", bid):
              a = attrs(c)
              have.add(a.get("capabilityType") or a.get("capability_type") or "")
          print("Уже включено:", ", ".join(sorted(x for x in have if x)) or "ничего")

          wanted = {"APPLE_ID_AUTH": "Sign In with Apple",
                    "PUSH_NOTIFICATIONS": "Push Notifications"}
          missing = [name for key, name in wanted.items() if key not in have]
          if missing:
              print("Включаю:", ", ".join(missing))
              # «Уже включено» (список прав прочитался не так) сборку не валит.
              if not run("bundle-ids", "enable-capabilities", bid, "--capability",
                         *missing, want_json=False, fatal=False):
                  print("⚠ Включить не вышло — дальше проверю профили")
          else:
              print("Всё нужное уже включено")

          # Проверка: права действительно включились? Иначе дальше Xcode
          # упадёт на подписи с невнятной ошибкой — лучше остановиться здесь
          # и сказать прямо, что включить руками.
          now = set()
          for c in run("bundle-ids", "capabilities", bid):
              print("  право:", json.dumps(c, ensure_ascii=False)[:300])
              a = attrs(c)
              now.add(a.get("capabilityType") or a.get("capability_type") or "")
          still = [name for key, name in wanted.items() if key not in now]
          if still:
              sys.exit("Apple не включила: " + ", ".join(still) +
                       ". Включить вручную: developer.apple.com → Identifiers → "
                       + bundle + " → галочки → Save, и запустить сборку снова.")

          # Профиль App Store, выпущенный до включения прав, остаётся
          # «активным», но прав в нём нет — Xcode его отвергает (сборка 06.10:
          # «profile doesn't include the Push Notifications capability»).
          # Поэтому каждый раз смотрим внутрь профилей этого приложения и
          # удаляем те, где нет aps-environment или Sign In with Apple; шаг
          # «Профили подписи» выпустит новый, уже с правами.
          import base64
          def content(p):
              a = attrs(p)
              raw = a.get("profileContent") or a.get("profile_content") or ""
              try:
                  return base64.b64decode(raw).decode("latin-1")
              except Exception:
                  return ""
          profiles = run("profiles", "list", "--type", "IOS_APP_STORE")
          for prof in profiles:
              text = content(prof)
              name = attrs(prof).get("name", "")
              if text:
                  if f".{bundle}<" not in text and f".{bundle}\n" not in text:
                      continue
                  ok = ("aps-environment" in text
                        and "com.apple.developer.applesignin" in text)
              else:
                  # Содержимое профиля CLI не отдал — узнаём свои по имени
                  # (Codemagic называет их «TeddyTales ios_app_store …») и
                  # пересоздаём: проверить права внутри нечем.
                  if not name.lower().startswith("teddytales"):
                      continue
                  ok = False
              print(f"Профиль «{name}» ({prof['id']}): {'права есть' if ok else 'прав нет'}")
              if not ok:
                  print("Удаляю профиль без новых прав:", prof["id"])
                  run("profiles", "delete", prof["id"], want_json=False, fatal=False)
          PY

      - name: Профили подписи
        # Подпись нарочно собрана скриптом, а не блоком `ios_signing`:
        # автоматический режим трижды падал с «No matching profiles found»
        # молча и до первого шага, хотя и Bundle ID, и профиль в портале
        # существовали. Здесь каждая команда пишет в лог, что она нашла
        # у Apple и что создала, — причину видно сразу.
        #
        # Требует секретную переменную CERTIFICATE_PRIVATE_KEY (группа
        # appstore): RSA-ключ, которым выпускается сертификат подписи.
        # Один раз сгенерировать и сохранить — см. docs/release-ios.md.
        script: |
          set -e
          keychain initialize
          echo "--- Что видит ключ API ---"
          app-store-connect list-bundle-ids \
            --bundle-id-identifier "$BUNDLE_ID" || true
          app-store-connect list-certificates --type DISTRIBUTION || true
          echo "--- Забираем или создаём файлы подписи ---"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Сборка ipa
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=APPLE_SIGN_IN=true \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal testers
        # В App Store не подаём: это отдельное решение и отдельная проверка.
        submit_to_app_store: false

      email:
        recipients:
          - ru.life3@gmail.com
        notify:
          success: true
          failure: true
