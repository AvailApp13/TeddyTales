name: Принести медиа из облака

# Мост через egress-прокси. Видео и картинки, которые Higgsfield отдаёт со
# своего CDN, из рабочей сессии недоступны: CONNECT на их домены прокси
# отклоняет. У раннера интернет открытый — он скачивает файл, при
# необходимости раскладывает видео на кадры и кладёт результат в ветку-кэш,
# откуда его забирает обычный git fetch.
#
# Список того, что нести, — `tool/fetch-media.json`.

on:
  push:
    branches:
      - claude/greeting-5sa20d
    paths:
      - tool/fetch-media.json
  workflow_dispatch:

permissions:
  contents: write

env:
  CACHE_BRANCH: claude/media-cache

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Скачать и разложить
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, urllib.request

          spec = json.loads(pathlib.Path('tool/fetch-media.json').read_text())
          out = pathlib.Path('media')
          out.mkdir(exist_ok=True)

          for name, item in spec['items'].items():
              url = item['url'] if isinstance(item, dict) else item
              suffix = pathlib.Path(url.split('?')[0]).suffix or '.bin'
              dst = out / f'{name}{suffix}'
              urllib.request.urlretrieve(url, dst)
              print(f'{name:16s} {dst.stat().st_size / 1e6:5.2f} МБ')

              if isinstance(item, dict) and item.get('frames'):
                  # Видео раскладываем на кадры: посмотреть ролик в рабочей
                  # сессии нельзя, а кадры читаются как обычные картинки.
                  shots = out / name
                  shots.mkdir(exist_ok=True)
                  subprocess.run(
                      ['ffmpeg', '-loglevel', 'error', '-i', str(dst),
                       '-vf', f'fps={item["frames"]},scale=540:-1',
                       str(shots / 'f%03d.jpg')],
                      check=True,
                  )
                  print(f'  кадров: {len(list(shots.glob("*.jpg")))}')
          PY

      - name: Выложить в ветку-кэш
        run: |
          set -eu
          staging="$(mktemp -d)"
          cp -r media/. "$staging/"

          git config user.name 'TeddyTales build'
          git config user.email 'ru.life3@gmail.com'
          git switch --orphan "$CACHE_BRANCH"
          mkdir -p media
          cp -r "$staging"/. media/
          git add media
          git commit -m 'Медиа из облака'
          git push -f -u origin "$CACHE_BRANCH"

          echo "## Принесено" >> "$GITHUB_STEP_SUMMARY"
          find media -type f | wc -l >> "$GITHUB_STEP_SUMMARY"
