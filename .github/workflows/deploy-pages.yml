name: Веб-версия на Pages

# Раскладывает готовую веб-сборку из ветки gh-pages на GitHub Pages, чтобы
# её можно было открыть по ссылке с телефона.
#
# Почему отдельным сценарием, а не из рабочей сессии: API Pages закрыт нашим
# egress-прокси, а у раннера доступ есть — `configure-pages` с
# `enablement: true` включает Pages сам, если он ещё не включён.
#
# Сборку кладёт в ветку тот, кто её собрал: `flutter build web --release
# --dart-define=RIVE_NATIVE_WASM_HOST=` (пустой, а не отсутствующий —
# по умолчанию рантайм Rive идёт за wasm на jsdelivr, который закрыт).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
