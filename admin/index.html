<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeddyTales — панель</title>
<style>
  :root {
    --ground: #F7F4EF;
    --panel: #FFFFFF;
    --ink: #33291F;
    --muted: #82705E;
    --line: #E6DCCD;
    --accent: #6E8F63;
    --accent-soft: #EAF1E6;
    --warn: #A8522F;
    --warn-soft: #FAEDE6;
    --shadow: 0 1px 2px rgba(51,41,31,.05), 0 8px 24px rgba(51,41,31,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14110D;
      --panel: #1E1A15;
      --ink: #EFE7DA;
      --muted: #A3937E;
      --line: #322B22;
      --accent: #9BBE8E;
      --accent-soft: #1E2A1B;
      --warn: #E09070;
      --warn-soft: #2E1E16;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #14110D; --panel: #1E1A15; --ink: #EFE7DA; --muted: #A3937E;
    --line: #322B22; --accent: #9BBE8E; --accent-soft: #1E2A1B;
    --warn: #E09070; --warn-soft: #2E1E16;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 80px; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--ground) 93%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .bar {
    max-width: 980px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap;
  }
  .who { font-size: 13px; color: var(--muted); }

  nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px 10px; max-width: 980px; margin: 0 auto; }
  nav button {
    flex: 0 0 auto; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 7px 13px; border-radius: 8px; white-space: nowrap;
  }
  nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.action {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--panel);
    border: 0; border-radius: 9px; padding: 9px 16px;
  }
  /* Цвет подписи задаётся только сплошным кнопкам. Раньше правило било по
     всем `.action`, а у него специфичность выше, чем у `.ghost` ниже, — и
     прозрачная кнопка получала белую подпись на светлом фоне, то есть
     исчезала. Видно это только глазами: разметка при этом верная. */
  :root[data-theme="dark"] button.action:not(.ghost),
  :root:not([data-theme="light"]) button.action:not(.ghost) { color: #14110D; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) button.action:not(.ghost) { color: #fff; }
  }
  button.action:disabled { opacity: .5; cursor: default; }
  button.action.ghost {
    background: none; color: var(--muted); border: 1px solid var(--line);
  }

  h1 { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  p.lede { color: var(--muted); margin: 0 0 22px; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; box-shadow: var(--shadow);
    margin-bottom: 14px;
  }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .n { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tile .k { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; padding-right: 0; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }

  input[type="text"], input[type="email"], input[type="password"], input[type="number"], textarea {
    font: inherit; background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.small { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 160px; }
  .note { font-size: 13px; color: var(--muted); }
  .bad { background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 0 10px 10px 0; padding: 12px 14px; margin: 12px 0; }
  .bad b { color: var(--warn); }
  .ok { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: 14px; }
  .hidden { display: none !important; }

  .signin { max-width: 380px; margin: 60px auto; }
  .muted-small { font-size: 12.5px; color: var(--muted); margin-top: 14px; }

  @media (max-width: 560px) {
    h1 { font-size: 22px; }
    .tile .n { font-size: 23px; }
  }
</style>
</head>
<body>

<div id="gate" class="wrap">
  <div class="signin card">
    <h1>Панель TeddyTales</h1>
    <p class="lede">Вход для сотрудников.</p>
    <label for="email">Почта</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:16px">
      <button class="action" id="btn-signin">Войти</button>
      <button class="action ghost" id="btn-signup">Создать доступ</button>
    </div>
    <div id="gate-msg"></div>
    <p class="muted-small">
      Доступ выдаётся заранее по адресу почты. Если адрес не в списке
      приглашённых, учётная запись создастся, но панель не откроется.
    </p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <span class="brand">TeddyTales · панель</span>
      <span class="who" id="who"></span>
      <button class="action ghost" id="btn-signout">Выйти</button>
    </div>
    <nav id="nav"></nav>
  </header>
  <div class="wrap" id="view"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Публичный ключ лежит в открытую намеренно: он и предназначен для
// браузера. Защищает не он, а построчные политики в базе — с этим ключом
// видно ровно то, что разрешено вошедшему.
const SUPABASE_URL = 'https://bwvwzzquiepghebskaib.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FP2uBrz1MNH8d22Gar5Igw_K3RVcpgw';

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (text) => String(text ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let role = null;

// --- Вход ------------------------------------------------------------------

async function boot() {
  const { data } = await db.auth.getSession();
  if (data.session) await enter();
}

async function enter() {
  const { data, error } = await db.from('staff').select('role').maybeSingle();
  if (error || !data) {
    // Учётная запись есть, а роли нет — значит адрес не приглашали.
    // Выходим сразу: панель без роли всё равно покажет пустые экраны,
    // и человек будет гадать, что сломалось.
    await db.auth.signOut();
    say('gate-msg', 'bad', 'Этой почте доступ не выдан. Обратитесь к администратору.');
    return;
  }
  role = data.role;
  const { data: me } = await db.auth.getUser();
  $('who').textContent = `${me?.user?.email ?? ''} · ${role === 'admin' ? 'администратор' : 'заказы'}`;
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  buildNav();
  open(sections()[0].id);
}

function say(target, kind, text) {
  $(target).innerHTML = `<div class="${kind}">${esc(text)}</div>`;
}

$('btn-signin').onclick = async () => {
  const { error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value,
  });
  if (error) return say('gate-msg', 'bad', error.message);
  await enter();
};

$('btn-signup').onclick = async () => {
  const { error } = await db.auth.signUp({
    email: $('email').value.trim(),
    password: $('password').value,
  });
  if (error) return say('gate-msg', 'bad', error.message);
  say('gate-msg', 'ok', 'Доступ создан. Если почта подтверждается — проверьте письмо, затем войдите.');
};

$('btn-signout').onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

// --- Разделы (КП 15) -------------------------------------------------------

function sections() {
  const all = [
    { id: 'dash', title: 'Дашборд', admin: false, render: renderDash },
    { id: 'economy', title: 'Экономика', admin: true, render: renderEconomy },
    { id: 'prices', title: 'Каталог и цены', admin: true, render: renderPrices },
    { id: 'content', title: 'Реплики и уведомления', admin: true, render: renderContent },
    { id: 'names', title: 'Модерация имён', admin: true, render: renderNames },
    { id: 'history', title: 'История правок', admin: true, render: renderHistory },
    { id: 'staff', title: 'Доступы', admin: true, render: renderStaff },
    { id: 'orders', title: 'Заказы', admin: false, render: renderOrders },
  ];
  return all.filter((s) => role === 'admin' || !s.admin);
}

function buildNav() {
  $('nav').innerHTML = sections()
    .map((s) => `<button data-id="${s.id}">${esc(s.title)}</button>`).join('');
  $('nav').querySelectorAll('button').forEach((b) => {
    b.onclick = () => open(b.dataset.id);
  });
}

async function open(id) {
  $('nav').querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-current', String(b.dataset.id === id));
  });
  const section = sections().find((s) => s.id === id);
  $('view').innerHTML = '<p class="note">Загружаю…</p>';
  try {
    await section.render();
  } catch (error) {
    $('view').innerHTML = `<div class="bad"><b>Не вышло.</b> ${esc(error.message || error)}</div>`;
  }
}

// --- Дашборд (КП 15.1) -----------------------------------------------------

const STAGE_TITLES = {
  newborn: 'Новорождённые', crawling: 'Ползают', firstSteps: 'Первые шаги',
  growing: 'Подрастают', adult: 'Взрослые',
};

async function renderDash() {
  const { data, error } = await db.rpc('admin_dashboard');
  if (error) throw error;

  const tiles = [
    ['Игроков', data.players],
    ['Новых за сутки', data.players_today],
    ['Активных за сутки', data.active_today],
    ['Питомцев', data.pets],
    ['Монет в игре', data.coins_total],
    ['Заработано за сутки', data.coins_earned_today],
    ['Покупок', data.purchases_total],
    ['Имён на проверке', data.names_pending],
  ];

  const byStage = Object.entries(data.by_stage || {});

  $('view').innerHTML = `
    <h1>Дашборд</h1>
    <p class="lede">Сводка по серверным часам: ${esc(new Date(data.server_time).toLocaleString('ru'))}</p>
    <div class="tiles">
      ${tiles.map(([k, n]) => `
        <div class="tile"><div class="n">${esc(n)}</div><div class="k">${esc(k)}</div></div>
      `).join('')}
    </div>
    <h2>По стадиям взросления</h2>
    <div class="card">
      ${byStage.length === 0 ? '<p class="note">Пока ни одного питомца.</p>' : `
        <table><tbody>${byStage.map(([stage, n]) => `
          <tr><td>${esc(STAGE_TITLES[stage] || stage)}</td><td class="num">${esc(n)}</td></tr>
        `).join('')}</tbody></table>`}
    </div>`;
}

// --- Экономика (КП 15.4) ---------------------------------------------------

const CONFIG_TITLES = {
  decay: 'Скорость падения показателей, % в час',
  care_gain: 'Насколько действие поднимает показатель',
  care_rewards: 'Монеты за действие ухода',
  edu: 'Награда за уровень обучения',
  stage_durations: 'Длительности стадий, часов',
  starting_items: 'Бесплатные предметы на старте',
  item_prices: 'Цены каталога',
};

async function loadConfig() {
  const { data, error } = await db.from('game_config').select('key, value, updated_at');
  if (error) throw error;
  return data;
}

async function renderEconomy() {
  const rows = (await loadConfig())
    .filter((r) => !['item_prices', 'starting_items'].includes(r.key));

  $('view').innerHTML = `
    <h1>Экономика</h1>
    <p class="lede">
      Меняется без новой сборки приложения. Каждая правка попадает в историю.
    </p>
    ${rows.map((row) => `
      <div class="card">
        <h2 style="margin-top:0">${esc(CONFIG_TITLES[row.key] || row.key)}</h2>
        <p class="note"><code>${esc(row.key)}</code></p>
        <table><tbody>
          ${Object.entries(row.value).map(([field, value]) => `
            <tr>
              <td>${esc(field)}</td>
              <td class="num">
                <input class="small" type="number" step="0.001"
                       data-key="${esc(row.key)}" data-field="${esc(field)}"
                       value="${esc(value)}">
              </td>
            </tr>`).join('')}
        </tbody></table>
        <div class="row" style="margin-top:14px">
          <button class="action" data-save="${esc(row.key)}">Сохранить</button>
          <span class="note" data-msg="${esc(row.key)}"></span>
        </div>
      </div>`).join('')}`;

  $('view').querySelectorAll('[data-save]').forEach((button) => {
    button.onclick = () => saveConfig(button.dataset.save, button);
  });
}

async function saveConfig(key, button) {
  const value = {};
  $('view').querySelectorAll(`input[data-key="${CSS.escape(key)}"]`).forEach((input) => {
    value[input.dataset.field] = Number(input.value);
  });

  button.disabled = true;
  const { error } = await db.from('game_config').update({ value }).eq('key', key);
  button.disabled = false;

  const msg = $('view').querySelector(`[data-msg="${CSS.escape(key)}"]`);
  msg.textContent = error ? `Не сохранилось: ${error.message}` : 'Сохранено';
  msg.style.color = error ? 'var(--warn)' : 'var(--accent)';
}

// --- Каталог и цены (КП 15.3) ----------------------------------------------

async function renderPrices() {
  const rows = await loadConfig();
  const prices = rows.find((r) => r.key === 'item_prices')?.value || {};
  const starting = rows.find((r) => r.key === 'starting_items')?.value || [];

  const items = Object.entries(prices).sort(([a], [b]) => a.localeCompare(b));

  $('view').innerHTML = `
    <h1>Каталог и цены</h1>
    <p class="lede">${items.length} предметов. Бесплатных на старте: ${starting.length}.</p>
    <div class="card">
      <div class="scroll">
        <table>
          <thead><tr><th>Предмет</th><th>На старте</th><th class="num">Цена, монет</th></tr></thead>
          <tbody>
            ${items.map(([id, price]) => `
              <tr>
                <td><code>${esc(id)}</code></td>
                <td class="note">${starting.includes(id) ? 'бесплатно' : ''}</td>
                <td class="num">
                  <input class="small" type="number" min="0" step="5"
                         data-price="${esc(id)}" value="${esc(price)}">
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="action" id="save-prices">Сохранить цены</button>
        <span class="note" id="prices-msg"></span>
      </div>
    </div>`;

  $('save-prices').onclick = async () => {
    const value = {};
    $('view').querySelectorAll('[data-price]').forEach((input) => {
      value[input.dataset.price] = Number(input.value);
    });
    const { error } = await db.from('game_config').update({ value }).eq('key', 'item_prices');
    $('prices-msg').textContent = error ? `Не сохранилось: ${error.message}` : 'Сохранено';
    $('prices-msg').style.color = error ? 'var(--warn)' : 'var(--accent)';
  };
}

// --- Контент: реплики и уведомления (КП 15.5) ------------------------------

const PHRASE_CONTEXTS = {
  greeting: 'Приветствие', idle: 'В покое', happy: 'Радость', sad: 'Грусть',
  hungry: 'Голод', sleepy: 'Сонливость', dirty: 'Испачкался',
  afterFeed: 'После кормления', afterWash: 'После умывания',
  afterPlay: 'После игры', afterPet: 'После поглаживания',
  afterWake: 'После пробуждения', invitePlay: 'Зовёт играть',
  inviteLearn: 'Зовёт учиться', stageUp: 'Подрос',
};

const LANGS = [['ru', 'Русский'], ['en', 'English'], ['zh', '中文']];

let contentLang = 'ru';

async function renderContent() {
  const [{ data: phrases, error: e1 }, { data: notes, error: e2 }] = await Promise.all([
    db.from('phrases').select('*').order('context').order('id'),
    db.from('notification_texts').select('*').order('kind'),
  ]);
  if (e1) throw e1;
  if (e2) throw e2;

  const byContext = {};
  for (const row of phrases) (byContext[row.context] ??= []).push(row);

  $('view').innerHTML = `
    <h1>Реплики и уведомления</h1>
    <p class="lede">
      Тексты приложения правятся здесь, без новой сборки. В приложении
      остаётся такой же набор — на случай, когда сети нет.
    </p>

    <div class="row" style="margin-bottom:18px">
      ${LANGS.map(([code, title]) => `
        <button class="action ${code === contentLang ? '' : 'ghost'}"
                data-lang="${code}">${esc(title)}</button>`).join('')}
    </div>

    <h2>Реплики питомца · ${phrases.length}</h2>
    ${Object.entries(byContext).map(([context, rows]) => `
      <div class="card">
        <h2 style="margin-top:0;font-size:15px">${esc(PHRASE_CONTEXTS[context] || context)}</h2>
        ${rows.map((row) => `
          <label for="ph-${esc(row.id)}">${esc(row.id)}</label>
          <input id="ph-${esc(row.id)}" type="text" data-phrase="${esc(row.id)}"
                 value="${esc(row[contentLang])}">`).join('')}
      </div>`).join('')}

    <h2>Уведомления · ${notes.length}</h2>
    <div class="card">
      ${notes.map((row) => `
        <label>${esc(row.kind)} · заголовок</label>
        <input type="text" data-note-title="${esc(row.kind)}"
               value="${esc(row['title_' + contentLang])}">
        <label>${esc(row.kind)} · текст</label>
        <input type="text" data-note-body="${esc(row.kind)}"
               value="${esc(row['body_' + contentLang])}">`).join('')}
    </div>

    <div class="row" style="margin-top:6px">
      <button class="action" id="save-content">Сохранить всё</button>
      <span class="note" id="content-msg"></span>
    </div>`;

  $('view').querySelectorAll('[data-lang]').forEach((b) => {
    b.onclick = () => { contentLang = b.dataset.lang; open('content'); };
  });

  $('save-content').onclick = async () => {
    const msg = $('content-msg');
    msg.textContent = 'Сохраняю…';
    msg.style.color = 'var(--muted)';

    // Пишем только изменённое: отправлять три десятка строк целиком ради
    // одной правки — лишний трафик и лишний шум в поле `updated_at`.
    const phraseEdits = [];
    $('view').querySelectorAll('[data-phrase]').forEach((input) => {
      const row = phrases.find((p) => p.id === input.dataset.phrase);
      if (row && row[contentLang] !== input.value) {
        phraseEdits.push({ id: row.id, value: input.value });
      }
    });

    const noteEdits = new Map();
    $('view').querySelectorAll('[data-note-title]').forEach((input) => {
      const row = notes.find((n) => n.kind === input.dataset.noteTitle);
      if (row && row['title_' + contentLang] !== input.value) {
        noteEdits.set(row.kind, { ...(noteEdits.get(row.kind) || {}),
          ['title_' + contentLang]: input.value });
      }
    });
    $('view').querySelectorAll('[data-note-body]').forEach((input) => {
      const row = notes.find((n) => n.kind === input.dataset.noteBody);
      if (row && row['body_' + contentLang] !== input.value) {
        noteEdits.set(row.kind, { ...(noteEdits.get(row.kind) || {}),
          ['body_' + contentLang]: input.value });
      }
    });

    if (phraseEdits.length === 0 && noteEdits.size === 0) {
      msg.textContent = 'Нечего сохранять';
      return;
    }

    const problems = [];
    for (const edit of phraseEdits) {
      const { error } = await db.from('phrases')
        .update({ [contentLang]: edit.value, updated_at: new Date().toISOString() })
        .eq('id', edit.id);
      if (error) problems.push(`${edit.id}: ${error.message}`);
    }
    for (const [kind, fields] of noteEdits) {
      const { error } = await db.from('notification_texts')
        .update({ ...fields, updated_at: new Date().toISOString() })
        .eq('kind', kind);
      if (error) problems.push(`${kind}: ${error.message}`);
    }

    if (problems.length) {
      msg.textContent = `Не сохранилось: ${problems[0]}`;
      msg.style.color = 'var(--warn)';
    } else {
      msg.textContent = `Сохранено: ${phraseEdits.length + noteEdits.size}`;
      msg.style.color = 'var(--accent)';
    }
  };
}

// --- Модерация имён (КП 15.6) ----------------------------------------------

async function renderNames() {
  const { data: queue, error } = await db.from('name_moderation')
    .select('id, name, locale, status, created_at')
    .order('created_at', { ascending: false }).limit(50);
  if (error) throw error;

  const { data: blocked } = await db.from('name_blocklist')
    .select('id, pattern, locale').order('pattern');

  $('view').innerHTML = `
    <h1>Модерация имён</h1>
    <p class="lede">Спорные имена и стоп-слова на трёх языках.</p>

    <h2>Очередь</h2>
    <div class="card">
      ${(!queue || queue.length === 0) ? '<p class="note">Очередь пуста.</p>' : `
        <table>
          <thead><tr><th>Имя</th><th>Язык</th><th>Статус</th><th></th></tr></thead>
          <tbody>${queue.map((row) => `
            <tr>
              <td>${esc(row.name)}</td>
              <td class="note">${esc(row.locale)}</td>
              <td class="note">${esc(row.status)}</td>
              <td class="num">
                <button class="action" data-approve="${row.id}">Принять</button>
                <button class="action ghost" data-reject="${row.id}">Отклонить</button>
              </td>
            </tr>`).join('')}</tbody>
        </table>`}
    </div>

    <h2>Стоп-слова</h2>
    <div class="card">
      <div class="row">
        <input class="grow" id="pattern" type="text" placeholder="слово или часть слова">
        <input class="small" id="pattern-locale" type="text" value="ru">
        <button class="action" id="add-pattern">Добавить</button>
      </div>
      ${(!blocked || blocked.length === 0) ? '<p class="note" style="margin-top:14px">Список пуст.</p>' : `
        <table style="margin-top:14px"><tbody>${blocked.map((row) => `
          <tr>
            <td>${esc(row.pattern)}</td>
            <td class="note">${esc(row.locale)}</td>
            <td class="num"><button class="action ghost" data-drop="${row.id}">Убрать</button></td>
          </tr>`).join('')}</tbody></table>`}
    </div>`;

  const decide = async (id, status) => {
    await db.from('name_moderation')
      .update({ status, reviewed_at: new Date().toISOString() }).eq('id', id);
    open('names');
  };
  $('view').querySelectorAll('[data-approve]').forEach((b) => {
    b.onclick = () => decide(b.dataset.approve, 'approved');
  });
  $('view').querySelectorAll('[data-reject]').forEach((b) => {
    b.onclick = () => decide(b.dataset.reject, 'rejected');
  });
  $('add-pattern').onclick = async () => {
    const pattern = $('pattern').value.trim();
    if (!pattern) return;
    await db.from('name_blocklist').insert({
      pattern, locale: $('pattern-locale').value.trim() || 'ru',
    });
    open('names');
  };
  $('view').querySelectorAll('[data-drop]').forEach((b) => {
    b.onclick = async () => {
      await db.from('name_blocklist').delete().eq('id', b.dataset.drop);
      open('names');
    };
  });
}

async function renderHistory() {
  const { data, error } = await db.from('config_history')
    .select('key, old_value, new_value, changed_at')
    .order('changed_at', { ascending: false }).limit(60);
  if (error) throw error;

  $('view').innerHTML = `
    <h1>История правок</h1>
    <p class="lede">Кто и когда менял настройки. Правится только запись, не история.</p>
    <div class="card">
      ${data.length === 0 ? '<p class="note">Пока пусто.</p>' : `
        <div class="scroll"><table>
          <thead><tr><th>Когда</th><th>Что</th><th>Стало</th></tr></thead>
          <tbody>${data.map((row) => `
            <tr>
              <td class="note">${esc(new Date(row.changed_at).toLocaleString('ru'))}</td>
              <td><code>${esc(row.key)}</code></td>
              <td class="note">${esc(JSON.stringify(row.new_value).slice(0, 90))}</td>
            </tr>`).join('')}</tbody>
        </table></div>`}
    </div>`;
}

// --- Доступы (КП 15.7) -----------------------------------------------------

async function renderStaff() {
  const { data, error } = await db.from('staff_invites')
    .select('email, role, invited_at').order('email');
  if (error) throw error;

  $('view').innerHTML = `
    <h1>Доступы</h1>
    <p class="lede">
      Кому разрешено войти в панель. Доступ выдаётся авансом: человек
      регистрируется этой почтой и получает роль автоматически.
    </p>
    <div class="card">
      <div class="row">
        <input class="grow" id="invite-email" type="email" placeholder="почта сотрудника">
        <select id="invite-role" style="padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);font:inherit">
          <option value="admin">администратор</option>
          <option value="orders">заказы</option>
        </select>
        <button class="action" id="add-invite">Пригласить</button>
      </div>
      ${data.length === 0 ? '<p class="note" style="margin-top:14px">Список пуст.</p>' : `
        <table style="margin-top:14px"><tbody>${data.map((row) => `
          <tr>
            <td>${esc(row.email)}</td>
            <td class="note">${row.role === 'admin' ? 'администратор' : 'заказы'}</td>
            <td class="num"><button class="action ghost" data-uninvite="${esc(row.email)}">Убрать</button></td>
          </tr>`).join('')}</tbody></table>`}
    </div>`;

  $('add-invite').onclick = async () => {
    const email = $('invite-email').value.trim();
    if (!email) return;
    await db.from('staff_invites').upsert({ email, role: $('invite-role').value });
    open('staff');
  };
  $('view').querySelectorAll('[data-uninvite]').forEach((b) => {
    b.onclick = async () => {
      await db.from('staff_invites').delete().eq('email', b.dataset.uninvite);
      open('staff');
    };
  });
}
